<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exam Schedule Planner</title>

<style>
/* NAVBAR */
.topbar{
    background:#13121b;
    color:#fff;
    padding:12px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:99;
}
.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:20px;}
.mark{width:34px;height:34px;background:#ffffff10;border-radius:6px;display:flex;align-items:center;justify-content:center;}
nav{display:flex;gap:16px;}
a{color:#fff;text-decoration:none;font-weight:600;padding:6px 8px;border-radius:6px;}
a.active{background:linear-gradient(90deg,#2b6ef6,#7c3aed);}
a:hover{background:#1e1e2f}

/* GLOBAL */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial;background:#f0f2f5;color:#222}

/* DASHBOARD */
.dashboard{
    background:#1e1e2f;
    padding:24px;
}
.dashboard h2{color:#fff;margin-bottom:16px}
.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:16px;
}
.dash-card{
    background:#2a2a3f;
    padding:18px;
    border-radius:12px;
    color:#fff;
}
.dash-value{
    font-size:32px;
    font-weight:800;
    margin-top:6px;
}

/* PAGE */
.container{
    max-width:1400px;
    margin:20px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
}
.header{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    padding:40px;
    text-align:center;
}
.content{padding:30px}
.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}
label{font-weight:600}
input,select{padding:10px;border-radius:8px;border:1px solid #ccc}
.btn{
    background:#1e3c72;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}
.exam-card{
    background:white;
    padding:18px;
    border-radius:12px;
    border:1px solid #ddd;
    display:flex;
    justify-content:space-between;
}
.days-left{
    background:#1e3c72;
    color:white;
    padding:8px 12px;
    border-radius:6px;
    font-weight:700;
}
.exam-list{display:grid;gap:15px;margin-top:20px}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="topbar">
    <div class="brand">
        <div class="mark">🎓</div>
        StudentAI
    </div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html">Planner</a>
        <a class="active">Exams</a>
        <a href="hackathon.html">Hackathons</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="index.html">Logout</a>
    </nav>
</header>

<!-- DASHBOARD -->
<section class="dashboard">
    <h2>Dashboard Overview</h2>
    <div class="dashboard-grid">
        <div class="dash-card">
            Total Exams
            <div class="dash-value" id="totalExams">0</div>
        </div>
        <div class="dash-card">
            Upcoming Exam
            <div class="dash-value" id="upcomingExam">-</div>
        </div>
        <div class="dash-card">
            Total Study Hours
            <div class="dash-value" id="totalHours">0</div>
        </div>
        <div class="dash-card">
            Today's Load
            <div class="dash-value" id="todayLoad">0h</div>
        </div>
    </div>
</section>

<!-- EXAM PLANNER -->
<div class="container">
    <div class="header">
        <h1>📚 Exam Schedule Planner</h1>
        <p>Plan your preparation effectively</p>
    </div>

    <div class="content">
        <div class="form-grid">
            <div>
                <label>Subject</label>
                <input id="subject">
            </div>
            <div>
                <label>Exam Date</label>
                <input type="date" id="examDate">
            </div>
            <div>
                <label>Hours Needed</label>
                <input type="number" id="hoursNeeded">
            </div>
        </div>

        <br>
        <button class="btn" onclick="addExam()">Add Exam</button>

        <div id="examList" class="exam-list"></div>
    </div>
</div>

<script>
let exams=[];

function updateDashboard(){
    document.getElementById("totalExams").textContent=exams.length;
    document.getElementById("totalHours").textContent=
        exams.reduce((s,e)=>s+e.hoursNeeded,0);

    if(exams.length){
        const next=exams.sort((a,b)=>new Date(a.examDate)-new Date(b.examDate))[0];
        document.getElementById("upcomingExam").textContent=next.subject;
        document.getElementById("todayLoad").textContent=
            Math.ceil(next.hoursNeeded/7)+"h";
    }
}

function addExam(){
    const subject=document.getElementById("subject").value;
    const examDate=document.getElementById("examDate").value;
    const hoursNeeded=parseInt(document.getElementById("hoursNeeded").value);

    if(!subject||!examDate||!hoursNeeded) return alert("Fill all fields");

    exams.push({id:Date.now(),subject,examDate,hoursNeeded});
    displayExams();
    updateDashboard();
}

function displayExams(){
    const list=document.getElementById("examList");
    list.innerHTML=exams.map(e=>{
        const days=Math.ceil((new Date(e.examDate)-new Date())/86400000);
        return `<div class="exam-card">
            <div>
                <h3>${e.subject}</h3>
                <p>${new Date(e.examDate).toDateString()}</p>
            </div>
            <div class="days-left">${days>0?days+" days":"Today"}</div>
        </div>`;
    }).join("");
}
</script>

</body>
</html>
