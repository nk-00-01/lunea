<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List | StudentAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>

<style>
    @keyframes float {
        0%, 100% { 
            transform: translateY(0px) rotate(0deg); 
            opacity: 0.4;
        }
        50% { 
            transform: translateY(-40px) rotate(15deg); 
            opacity: 0.7;
        }
    }

    @keyframes fadeInSlide {
        from { 
            opacity: 0; 
            transform: translateX(-30px) scale(0.95);
        }
        to { 
            opacity: 1; 
            transform: translateX(0) scale(1);
        }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
        50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.6), 0 0 60px rgba(59, 130, 246, 0.4); }
    }

    @keyframes bounceIn {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.05); }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes slideDown {
        from { 
            opacity: 0; 
            transform: translateY(-50px);
        }
        to { 
            opacity: 1; 
            transform: translateY(0);
        }
    }

    @keyframes sparkle {
        0%, 100% { 
            opacity: 0.4; 
            transform: scale(0.9) rotate(0deg); 
        }
        50% { 
            opacity: 0.9; 
            transform: scale(1.4) rotate(180deg); 
        }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }

    .task-item {
        animation: fadeInSlide 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .float-icon {
        animation: float 6s ease-in-out infinite;
    }

    .sparkle-icon {
        animation: sparkle 3s ease-in-out infinite;
    }

    .title-animate {
        animation: slideDown 0.8s ease-out;
    }

    .button-pulse {
        animation: pulse 2s ease-in-out infinite;
    }

    .gradient-bg {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }

    .glass-effect {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .todo-glass {
        background: rgba(15, 23, 42, 0.3);
        
        border: 1px solid rgba(99, 102, 241, 0.15);
    }

    .task-card {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.6) 100%);
        border: 1px solid rgba(99, 102, 241, 0.3);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
    }

    .task-card:hover {
        border-color: rgba(99, 102, 241, 0.6);
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
    }

    .gradient-button {
        background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .gradient-button::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }

    .gradient-button:hover::before {
        width: 300px;
        height: 300px;
    }

    .gradient-button:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5), 0 5px 15px rgba(6, 182, 212, 0.3);
        animation: glow 2s ease-in-out infinite;
    }

    .gradient-button:active {
        transform: translateY(-1px) scale(0.98);
    }

    input:focus {
        outline: none;
        border-color: #06b6d4;
        box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .checkbox-custom {
        appearance: none;
        width: 24px;
        height: 24px;
        border: 2px solid #4b5563;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }

    .checkbox-custom:checked {
        background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
        border-color: #06b6d4;
        animation: bounceIn 0.5s ease-out;
    }

    .checkbox-custom:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-weight: bold;
        font-size: 14px;
    }

    .task-completed {
        opacity: 0.6;
        transition: all 0.5s ease;
    }

    .task-completed .task-text {
        text-decoration: line-through;
    }

    .delete-button {
        transition: all 0.3s ease;
    }

    .delete-button:hover {
        animation: shake 0.5s ease;
    }

    body {
        overflow-x: hidden;
    }
</style>
</head>

<body class="gradient-bg min-h-screen text-white relative">

<!-- Floating decorative elements -->
<div class="fixed top-20 left-10 text-cyan-400 text-7xl opacity-40 float-icon pointer-events-none z-0" style="animation-delay: 0s;">✓</div>
<div class="fixed top-40 right-20 text-blue-400 text-6xl opacity-40 float-icon pointer-events-none z-0" style="animation-delay: 1s;">📝</div>
<div class="fixed bottom-32 left-20 text-purple-400 text-5xl opacity-40 float-icon pointer-events-none z-0" style="animation-delay: 2s;">⚡</div>
<div class="fixed top-1/2 right-10 text-cyan-400 text-5xl opacity-40 sparkle-icon pointer-events-none z-0" style="animation-delay: 0s;">✨</div>
<div class="fixed top-1/3 left-1/4 text-blue-500 text-5xl opacity-35 float-icon pointer-events-none z-0" style="animation-delay: 3s;">📚</div>
<div class="fixed bottom-40 right-1/4 text-purple-500 text-5xl opacity-40 sparkle-icon pointer-events-none z-0" style="animation-delay: 1.5s;">🎯</div>
<div class="fixed top-2/3 right-20 text-cyan-300 text-6xl opacity-30 float-icon pointer-events-none z-0" style="animation-delay: 2.5s;">🚀</div>
<div class="fixed top-60 left-1/3 text-purple-400 text-5xl opacity-35 sparkle-icon pointer-events-none z-0" style="animation-delay: 2s;">💡</div>
<div class="fixed bottom-60 left-32 text-blue-300 text-6xl opacity-30 float-icon pointer-events-none z-0" style="animation-delay: 3.5s;">🎓</div>
<div class="fixed top-1/4 right-1/3 text-cyan-500 text-4xl opacity-35 sparkle-icon pointer-events-none z-0" style="animation-delay: 1s;">⭐</div>
<div class="fixed bottom-1/4 left-1/2 text-purple-300 text-5xl opacity-30 float-icon pointer-events-none z-0" style="animation-delay: 4s;">🌟</div>

<!-- NAVBAR -->
<nav class="glass-effect shadow-lg relative z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <h2 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">StudentAI</h2>
        <div class="flex gap-6">
            <a href="dashboard.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Dashboard</a>
            <a href="planner.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Planner</a>
            <a href="exam.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Exams</a>
            <a href="hackathon.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Hackathons</a>
            <a href="profile.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Profile</a>
            <a href="settings.html" class="text-gray-300 hover:text-cyan-400 transition-colors font-medium">Settings</a>
            <a href="index.html" class="text-gray-300 hover:text-red-400 transition-colors font-medium">Logout</a>
        </div>
    </div>
</nav>

<!-- TODO LIST -->
<div class="max-w-4xl mx-auto px-6 py-16 pb-32 relative z-40">
    <div class="todo-glass rounded-2xl p-8 shadow-2xl title-animate border border-cyan-500/20">
        <h2 class="text-4xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 bg-clip-text text-transparent">
            My To-Do List ✨
        </h2>
        <p class="text-center text-gray-400 mb-8">Achieve more 🚀</p>

        <!-- Input Section -->
        <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_auto] gap-4 mb-8">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter your task..." 
                class="px-5 py-3 rounded-xl bg-slate-800/30 border border-slate-600/50 text-white placeholder-gray-500 transition-all focus:border-cyan-400 backdrop-blur-sm"
            />
            <input 
                type="date" 
                id="dateInput" 
                class="px-5 py-3 rounded-xl bg-slate-800/30 border border-slate-600/50 text-white transition-all focus:border-cyan-400 backdrop-blur-sm"
            />
            <button 
                onclick="addTask()" 
                class="gradient-button px-8 py-3 rounded-xl text-white font-semibold shadow-lg hover:shadow-cyan-500/50 relative"
            >
                <span class="relative z-10">✨ Add Task</span>
            </button>
        </div>

        <!-- Task List -->
        <div id="taskList" class="space-y-3">
            <!-- Tasks will be added here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-12">
            <div class="text-7xl mb-4 opacity-40 button-pulse">📋</div>
            <p class="text-gray-400 text-lg mb-2">No tasks yet. Ready to be productive?</p>
            <p class="text-gray-500 text-sm">Add your first task and start achieving your goals! 🎯</p>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="glass-effect fixed bottom-0 w-full text-center py-4 text-gray-400 z-50">
    © 2025 StudentAI Dashboard
</footer>

<script>
    /* ================= CONFIG ================= */
    const BASE_URL = "https://lunea-aoc1.onrender.com/api";

    // TEMP: for testing (replace later with login storage)
    const STUDENT_ID = "123";
    const TOKEN = localStorage.getItem("token"); // optional, safe if null

    /* ================= HELPERS ================= */
    function authHeaders() {
        const headers = {
            "Content-Type": "application/json"
        };
        if (TOKEN) {
            headers["Authorization"] = `Bearer ${TOKEN}`;
        }
        return headers;
    }

    function checkEmptyState() {
        const taskList = document.getElementById("taskList");
        const emptyState = document.getElementById("emptyState");
        emptyState.style.display = taskList.children.length === 0 ? "block" : "none";
    }

    /* ================= LOAD TODOS ================= */
    async function loadTodos() {
        try {
            const res = await fetch(`${BASE_URL}/todo/${STUDENT_ID}`, {
                headers: authHeaders()
            });

            if (!res.ok) throw new Error("Failed to load todos");

            const data = await res.json();
            document.getElementById("taskList").innerHTML = "";

            data.todos.forEach(todo => {
                renderTask(todo.id, todo.task);
            });

            checkEmptyState();
        } catch (err) {
            console.error("Load todos error:", err);
        }
    }

    /* ================= RENDER TASK ================= */
    function renderTask(todoId, task, dueDate = "") {
        const taskDiv = document.createElement("div");
        taskDiv.className = "task-card rounded-xl p-5 flex items-center justify-between gap-4 task-item";
        taskDiv.dataset.id = todoId;

        taskDiv.innerHTML = `
            <div class="flex items-center gap-4 flex-1">
                <input type="checkbox" class="checkbox-custom" onclick="toggleTask(this)" />
                <div class="task-info flex-1">
                    <div class="task-text text-lg font-medium text-white mb-1">
                        ${task}
                    </div>
                    <div class="text-sm text-gray-400">
                        <span class="inline-flex items-center gap-1">
                            📅 ${dueDate || "No due date"}
                        </span>
                    </div>
                </div>
            </div>
            <button 
                onclick="deleteTask(this)" 
                class="delete-button bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white px-4 py-2 rounded-lg transition-all font-medium border border-red-500/30 hover:border-red-500"
            >
                🗑️ Delete
            </button>
        `;

        document.getElementById("taskList").appendChild(taskDiv);
    }

    /* ================= ADD TASK ================= */
    async function addTask() {
        const taskInput = document.getElementById("taskInput");
        const dateInput = document.getElementById("dateInput");

        const task = taskInput.value.trim();
        const dueDate = dateInput.value;

        if (!task) return;

        try {
            const res = await fetch(`${BASE_URL}/todo/${STUDENT_ID}`, {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({ task })
            });

            if (!res.ok) throw new Error("Failed to add todo");

            const data = await res.json();
            renderTask(data.id, task, dueDate);

            taskInput.value = "";
            dateInput.value = "";
            checkEmptyState();
        } catch (err) {
            console.error("Add task error:", err);
        }
    }

    /* ================= DELETE TASK ================= */
    async function deleteTask(button) {
        const taskCard = button.closest(".task-card");
        const todoId = taskCard.dataset.id;

        try {
            const res = await fetch(`${BASE_URL}/todo/detail/${todoId}`, {
                method: "DELETE",
                headers: authHeaders()
            });

            if (!res.ok) throw new Error("Failed to delete todo");

            taskCard.style.animation = 'fadeInSlide 0.3s ease-out reverse';
            setTimeout(() => {
                taskCard.remove();
                checkEmptyState();
            }, 300);
        } catch (err) {
            console.error("Delete task error:", err);
        }
    }

    /* ================= UI FUNCTIONS (UNCHANGED) ================= */
    function toggleTask(checkbox) {
        const taskCard = checkbox.closest('.task-card');
        if (checkbox.checked) {
            taskCard.classList.add('task-completed');
            createConfetti(checkbox);
        } else {
            taskCard.classList.remove('task-completed');
        }
    }

    function createConfetti(element) {
        const colors = ['#06b6d4', '#3b82f6', '#a855f7', '#22d3ee'];
        for (let i = 0; i < 15; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.width = '8px';
            confetti.style.height = '8px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = '50%';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = '9999';

            const rect = element.getBoundingClientRect();
            confetti.style.left = rect.left + 'px';
            confetti.style.top = rect.top + 'px';

            document.body.appendChild(confetti);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 100 + Math.random() * 100;

            confetti.animate([
                { transform: 'translate(0,0)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px)`, opacity: 0 }
            ], {
                duration: 1000,
                easing: 'ease-out'
            }).onfinish = () => confetti.remove();
        }
    }

    /* ================= INIT ================= */
    document.getElementById("taskInput").addEventListener("keypress", e => {
        if (e.key === "Enter") addTask();
    });

    loadTodos();
</script>


</body>
</html>
