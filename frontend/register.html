<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - StudentAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="register-hero">
    <div class="register-box">
        <h2>Register</h2>

        <form id="registerForm">

            <input type="text" id="id" placeholder="Student ID" required>
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="number" id="age" placeholder="Age">
            <input type="text" id="phone" placeholder="Mobile Number">

            <select id="branch" required>
                <option value="">Loading branches...</option>
            </select>

            <select id="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>

            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script>
/* ==============================
   LOAD BRANCHES FROM BACKEND
================================ */
async function loadBranches() {
    try {
        const response = await fetch("https://lunea-aoc1.onrender.com/api/register/"); // GET branches
        if (!response.ok) throw new Error("Failed to fetch branches");
        const branches = await response.json();

        const branchSelect = document.getElementById("branch");
        branchSelect.innerHTML = '<option value="">Select Branch</option>';

        branches.forEach(branch => {
            const option = document.createElement("option");
            option.value = branch.id;
            option.textContent = branch.name.toUpperCase();
            branchSelect.appendChild(option);
        });
    } catch (error) {
        console.error("Error loading branches:", error);
        document.getElementById("branch").innerHTML =
            '<option value="">Failed to load branches</option>';
    }
}

window.onload = loadBranches;

/* ==============================
   REGISTER FORM SUBMIT
================================ */
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    const payload = {
        id: document.getElementById("id").value,
        name: document.getElementById("name").value,
        age: document.getElementById("age").value || null,
        phone: document.getElementById("phone").value || null,
        password: password,
        branch_id: document.getElementById("branch").value, // match backend field
        year: document.getElementById("year").value
    };

    try {
        const response = await fetch("https://lunea-aoc1.onrender.com/api/register/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            alert("Registration successful!");
            window.location.href = "login.html";
        } else {
            alert(data.Alert || data.error || "Registration failed");
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Error connecting to server");
    }
});


</script>

</body>
</html>
