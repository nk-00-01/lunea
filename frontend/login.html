<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - StudentAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Universal CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-[#020617] via-[#020617] to-[#042f2e] text-white">

    <!-- NAVBAR -->
    <nav class="navbar-glass px-12 py-5 flex justify-between items-center relative z-10">
        <a href="index.html" class="brand-text">StudentAI</a>

        <div class="flex gap-10 text-sm md:text-base">
            <a href="login.html" class="nav-link">Login</a>
            <a href="register.html" class="nav-link">Register</a>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <section class="flex-1 flex items-center justify-center px-6 relative z-10">
        <div class="form-box">
            <h2>Login</h2>

            <form id="loginForm">
                <input type="text" id="studentId" placeholder="Student ID" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <p>New user? <a href="register.html">Register here</a></p>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-5 text-sm text-gray-400 relative z-10">
        © 2025 StudentAI Dashboard
    </footer>

<script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const id = document.getElementById('studentId').value.trim();
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('https://lunea-aoc1.onrender.com/api/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id, password })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            // ✅ Store JWT token and student_id
            localStorage.setItem("token", data.token);
            localStorage.setItem("student_id", data.student_id);

            // ✅ Redirect to dashboard
            window.location.href = "dashboard.html";
        } else {
            alert(data.error || "Invalid credentials");
        }

    } catch (err) {
        console.error("Login error:", err);
        alert("Error connecting to server");
    }
});
</script>

</body>
</html>
