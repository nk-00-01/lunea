<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Wellness Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating particles background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            25% { transform: translateY(-100px) translateX(50px) scale(1.2); opacity: 0.6; }
            50% { transform: translateY(-50px) translateX(-50px) scale(0.8); opacity: 0.4; }
            75% { transform: translateY(-150px) translateX(100px) scale(1.1); opacity: 0.5; }
        }

        /* Robot Container */
        .robot-container {
            position: relative;
            width: 200px;
            height: 250px;
            margin: 0 auto 2rem;
        }

        /* Robot Body */
        .robot {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: robotHop 2s ease-in-out infinite;
        }

        @keyframes robotHop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .robot-head {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 90px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            border-radius: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: headTilt 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes headTilt {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-3deg); }
            75% { transform: translateX(-50%) rotate(3deg); }
        }

        /* Side Ears/Speakers */
        .ear {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 35px;
            background: linear-gradient(135deg, #e8e8e8 0%, #d0d0d0 100%);
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .ear-left {
            left: -22px;
        }

        .ear-right {
            right: -22px;
        }

        .antenna {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 25px;
            background: linear-gradient(180deg, #d0d0d0 0%, #a0a0a0 100%);
            border-radius: 2px;
        }

        .antenna::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 100%);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            animation: antennaBlink 2s ease-in-out infinite;
        }

        @keyframes antennaBlink {
            0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(0, 229, 255, 0.8); }
            50% { opacity: 0.6; box-shadow: 0 0 30px rgba(0, 229, 255, 1); }
        }

        /* Visor/Eye Screen */
        .visor {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 40px;
            background: linear-gradient(135deg, #1a4d4d 0%, #0d2626 100%);
            border-radius: 20px;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Eyes - Cyan Glowing Rectangles */
        .eyes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
        }

        .eye {
            width: 22px;
            height: 32px;
            background: linear-gradient(135deg, #00e5ff 0%, #00b8d4 100%);
            border-radius: 5px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.9),
                        inset 0 2px 5px rgba(255, 255, 255, 0.5);
            animation: eyeGlow 3s ease-in-out infinite;
        }

        @keyframes eyeGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(0, 229, 255, 0.9),
                           inset 0 2px 5px rgba(255, 255, 255, 0.5);
            }
            50% { 
                box-shadow: 0 0 30px rgba(0, 229, 255, 1),
                           inset 0 2px 5px rgba(255, 255, 255, 0.7);
            }
        }

        /* Headset/Microphone */
        .headset {
            position: absolute;
            bottom: 8px;
            right: -15px;
            width: 4px;
            height: 30px;
            background: #333;
            border-radius: 2px;
            transform: rotate(-15deg);
        }

        .headset::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: -6px;
            width: 12px;
            height: 12px;
            background: #2a2a2a;
            border-radius: 50%;
        }

        /* Robot Body */
        .robot-body {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 85px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        /* Cyan stripes on body */
        .body-stripe {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 6px;
            background: linear-gradient(90deg, #00e5ff 0%, #00b8d4 100%);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .stripe-1 {
            top: 25px;
        }

        .stripe-2 {
            top: 45px;
        }

        /* Arms with cyan stripes */
        .arm {
            position: absolute;
            top: 125px;
            width: 22px;
            height: 65px;
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 15px;
            transform-origin: top center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .arm-left {
            left: 15px;
            animation: waveLeft 2.5s ease-in-out infinite;
        }

        .arm-right {
            right: 15px;
            animation: waveRight 2.5s ease-in-out infinite;
        }

        @keyframes waveLeft {
            0%, 100% { transform: rotate(-25deg); }
            50% { transform: rotate(-50deg); }
        }

        @keyframes waveRight {
            0%, 100% { transform: rotate(25deg); }
            50% { transform: rotate(50deg); }
        }

        .arm-stripe {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 4px;
            background: linear-gradient(90deg, #00e5ff 0%, #00b8d4 100%);
            border-radius: 2px;
        }

        .arm-stripe-1 {
            top: 20px;
        }

        .arm-stripe-2 {
            top: 30px;
        }

        .hand {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 18px;
            background: linear-gradient(135deg, #ffffff 0%, #e8e8e8 100%);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Legs with cyan bands */
        .leg {
            position: absolute;
            top: 200px;
            width: 22px;
            height: 45px;
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .leg-left {
            left: 60px;
        }

        .leg-right {
            left: 118px;
        }

        .leg-band {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 5px;
            background: linear-gradient(90deg, #00e5ff 0%, #00b8d4 100%);
            border-radius: 2px;
        }

        .foot {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 18px;
            background: linear-gradient(135deg, #e0e0e0 0%, #c8c8c8 100%);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            white-space: nowrap;
            opacity: 0;
            animation: speechAppear 0.5s ease-out 1s forwards;
        }

        @keyframes speechAppear {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }

        /* Chat Interface */
        .chat-container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            text-align: center;
            color: white;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 25px;
            background: linear-gradient(to bottom, #fafafa 0%, #ffffff 100%);
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* FIXED: Complete message-content styling */
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.bot .message-content {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e7ff 100%);
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .chat-input-container {
            padding: 20px 25px;
            background: white;
            border-top: 2px solid #e0e7ff;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e7ff;
            border-radius: 25px;
            font-size: 15px;
            font-family: 'Fredoka', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e7ff 100%);
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOut 1s ease-out 4s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; pointer-events: none; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Floating Particles Background -->
    <div class="particles">
        <div class="particle" style="width: 20px; height: 20px; top: 10%; left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="width: 30px; height: 30px; top: 20%; left: 80%; animation-delay: 2s;"></div>
        <div class="particle" style="width: 15px; height: 15px; top: 60%; left: 15%; animation-delay: 4s;"></div>
        <div class="particle" style="width: 25px; height: 25px; top: 70%; left: 85%; animation-delay: 1s;"></div>
        <div class="particle" style="width: 18px; height: 18px; top: 40%; left: 50%; animation-delay: 3s;"></div>
        <div class="particle" style="width: 22px; height: 22px; top: 85%; left: 30%; animation-delay: 5s;"></div>
    </div>

    <!-- Intro Screen with Robot Animation -->
    <div id="introScreen" class="intro-screen">
        <div class="robot-container">
            <div class="robot">
                <div class="speech-bubble">Hi there! 👋</div>
                
                <div class="robot-head">
                    <div class="ear ear-left"></div>
                    <div class="ear ear-right"></div>
                    <div class="antenna"></div>
                    <div class="visor">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                    <div class="headset"></div>
                </div>

                <div class="robot-body">
                    <div class="body-stripe stripe-1"></div>
                    <div class="body-stripe stripe-2"></div>
                </div>

                <div class="arm arm-left">
                    <div class="arm-stripe arm-stripe-1"></div>
                    <div class="arm-stripe arm-stripe-2"></div>
                    <div class="hand"></div>
                </div>
                <div class="arm arm-right">
                    <div class="arm-stripe arm-stripe-1"></div>
                    <div class="arm-stripe arm-stripe-2"></div>
                    <div class="hand"></div>
                </div>

                <div class="leg leg-left">
                    <div class="leg-band"></div>
                    <div class="foot"></div>
                </div>
                <div class="leg leg-right">
                    <div class="leg-band"></div>
                    <div class="foot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="container mx-auto px-4 py-8" style="position: relative; z-index: 10;">
        <!-- Cute Robot at Top -->
        <div class="robot-container" style="margin-top: 2rem;">
            <div class="robot">
                <div class="robot-head">
                    <div class="ear ear-left"></div>
                    <div class="ear ear-right"></div>
                    <div class="antenna"></div>
                    <div class="visor">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                    <div class="headset"></div>
                </div>

                <div class="robot-body">
                    <div class="body-stripe stripe-1"></div>
                    <div class="body-stripe stripe-2"></div>
                </div>

                <div class="arm arm-left">
                    <div class="arm-stripe arm-stripe-1"></div>
                    <div class="arm-stripe arm-stripe-2"></div>
                    <div class="hand"></div>
                </div>
                <div class="arm arm-right">
                    <div class="arm-stripe arm-stripe-1"></div>
                    <div class="arm-stripe arm-stripe-2"></div>
                    <div class="hand"></div>
                </div>

                <div class="leg leg-left">
                    <div class="leg-band"></div>
                    <div class="foot"></div>
                </div>
                <div class="leg leg-right">
                    <div class="leg-band"></div>
                    <div class="foot"></div>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="chat-header">
                <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Academic Wellness Bot</h1>
                <p style="font-size: 16px; opacity: 0.9;">Your friendly study companion 🌟</p>
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="message bot">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        Hello! I'm here to help you with academic stress, exam anxiety, and workload management. How are you feeling today?
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        id="chatInput" 
                        class="chat-input" 
                        placeholder="Type your message here..."
                        onkeypress="if(event.key === 'Enter') sendMessage()"
                    />
                    <button id="sendButton" class="send-button" onclick="sendMessage()">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://lunea-aoc1.onrender.com';

        // Hide intro screen after animation
        setTimeout(() => {
            document.getElementById('introScreen').classList.add('hidden');
        }, 5000);

        // Get auth token from existing session/localStorage
        function getAuthToken() {
            return localStorage.getItem('token');
        }

        // Chat functionality
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            const authToken = getAuthToken();

            if (!authToken) {
                addMessage('Please login to use the chatbot.', 'bot');
                return;
            }

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            // Show typing indicator
            const typingId = showTypingIndicator();

            // Disable send button
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/chatbot`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                // Remove typing indicator
                removeTypingIndicator(typingId);

                if (response.ok && data.reply) {
                    addMessage(data.reply, 'bot');
                } else {
                    addMessage('Sorry, I encountered an error. Please try again.', 'bot');
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                addMessage('Network error. Please check your connection and try again.', 'bot');
                console.error('Chat error:', error);
            }

            // Re-enable send button
            sendButton.disabled = false;
        }

        function addMessage(text, sender) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'bot' ? '🤖' : '👤';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            messagesContainer.appendChild(messageDiv);

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            typingDiv.appendChild(avatar);
            typingDiv.appendChild(indicator);
            messagesContainer.appendChild(typingDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return typingDiv.id;
        }

        function removeTypingIndicator(id) {
            const typingDiv = document.getElementById(id);
            if (typingDiv) {
                typingDiv.remove();
            }
        }
    </script>
</body>
</html>
