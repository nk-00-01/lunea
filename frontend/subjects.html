<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subjects | StudentAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @keyframes fall {
            to {
                top: 110%;
                transform: translateX(20px) rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .falling-container span {
            position: absolute;
            top: -50px;
            font-size: 24px;
            opacity: 0.15;
            animation: fall linear infinite;
        }

        .falling-container span:nth-child(1) { left: 10%; animation-duration: 15s; animation-delay: 0s; }
        .falling-container span:nth-child(2) { left: 20%; animation-duration: 18s; animation-delay: 2s; }
        .falling-container span:nth-child(3) { left: 30%; animation-duration: 12s; animation-delay: 4s; }
        .falling-container span:nth-child(4) { left: 40%; animation-duration: 20s; animation-delay: 1s; }
        .falling-container span:nth-child(5) { left: 50%; animation-duration: 16s; animation-delay: 3s; }
        .falling-container span:nth-child(6) { left: 60%; animation-duration: 14s; animation-delay: 5s; }
        .falling-container span:nth-child(7) { left: 70%; animation-duration: 19s; animation-delay: 2s; }
        .falling-container span:nth-child(8) { left: 80%; animation-duration: 17s; animation-delay: 4s; }
        .falling-container span:nth-child(9) { left: 90%; animation-duration: 13s; animation-delay: 1s; }
        .falling-container span:nth-child(10) { left: 15%; animation-duration: 21s; animation-delay: 6s; }

        .navbar-glass {
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: #d1d5db;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #10b981;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.6s ease forwards;
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #10b981;
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .subject-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
        }

        .subject-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateX(5px);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fee2e2;
            transform: scale(1.05);
        }

        .empty-state {
            opacity: 0.6;
            animation: fadeInUp 0.5s ease forwards;
        }

        .subject-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-br from-[#020617] via-[#020617] to-[#042f2e] text-white">

    <!-- SYMBOL BACKGROUND -->
    <div class="falling-container">
        <span>∑</span>
        <span>π</span>
        <span>√</span>
        <span>📐</span>
        <span>✏️</span>
        <span>🖊️</span>
        <span>E = mc²</span>
        <span>∫</span>
        <span>📏</span>
        <span>θ</span>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar-glass px-6 md:px-12 py-5 flex justify-between items-center relative z-10">
        <h2 class="brand-text">StudentAI</h2>
        <div class="flex gap-6 md:gap-10 text-sm md:text-base">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="planner.html" class="nav-link">Planner</a>
            <a href="exam.html" class="nav-link">Exams</a>
            <a href="#" onclick="logout()" class="nav-link">Logout</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 relative z-10 px-6 py-12">
        <div class="max-w-4xl mx-auto">
            
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">
                    <span class="bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                        My Subjects
                    </span>
                </h1>
                <p class="text-gray-400 text-lg">Manage the subjects you are currently pursuing</p>
            </div>

            <!-- Add Subject Card -->
            <div class="glass-card rounded-2xl p-6 md:p-8 mb-8">
                <h3 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    <span class="text-2xl">📚</span>
                    Add New Subject
                </h3>
                
                <form id="subjectForm" class="flex gap-3">
                    <input 
                        type="text" 
                        id="subjectName" 
                        placeholder="e.g., Mathematics, Physics, Computer Science..."
                        class="input-glass flex-1 px-6 py-4 rounded-xl text-white placeholder-gray-500"
                        required
                    >
                    <button 
                        type="submit" 
                        class="add-btn px-8 py-4 rounded-xl font-semibold whitespace-nowrap hover:shadow-lg"
                    >
                        Add Subject
                    </button>
                </form>
            </div>

            <!-- Subjects List -->
            <div class="glass-card rounded-2xl p-6 md:p-8">
                <h3 class="text-xl font-semibold mb-6 flex items-center gap-2">
                    <span class="text-2xl">📖</span>
                    Your Subjects
                    <span id="subjectCount" class="ml-auto text-sm font-normal text-gray-400"></span>
                </h3>
                
                <div id="subjectsList" class="space-y-3">
                    <!-- Loading state -->
                    <div id="loadingState" class="text-center py-8">
                        <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-gray-400 mt-4">Loading subjects...</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state text-center py-12 hidden">
                    <div class="text-6xl mb-4">📚</div>
                    <h3 class="text-xl font-semibold mb-2 text-gray-300">No subjects yet</h3>
                    <p class="text-gray-500">Add your first subject to get started!</p>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-5 text-sm text-gray-400 relative z-10">
        © 2025 StudentAI Dashboard
    </footer>

    <script>
        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please login again");
            window.location.href = "login.html";
        }

        // Subject icons mapping
        const subjectIcons = {
            'math': '🔢',
            'science': '🔬',
            'physics': '⚛️',
            'chemistry': '🧪',
            'biology': '🧬',
            'computer': '💻',
            'english': '📝',
            'history': '📜',
            'geography': '🌍',
            'art': '🎨',
            'music': '🎵',
            'sports': '⚽',
            'economics': '💰',
            'business': '💼',
            'language': '🗣️',
            'literature': '📖',
            'default': '📚'
        };

        function getSubjectIcon(name) {
            const lowerName = name.toLowerCase();
            for (let key in subjectIcons) {
                if (lowerName.includes(key)) {
                    return subjectIcons[key];
                }
            }
            return subjectIcons['default'];
        }

        /* ================= LOAD SUBJECTS ================= */
        async function loadSubjects() {
            const loadingState = document.getElementById("loadingState");
            const emptyState = document.getElementById("emptyState");
            const subjectsList = document.getElementById("subjectsList");
            const subjectCount = document.getElementById("subjectCount");

            try {
                const res = await fetch("https://lunea-aoc1.onrender.com/api/subjects/", {
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) throw new Error("Failed to load subjects");

                const subjects = await res.json();
                
                // Hide loading
                loadingState.style.display = 'none';
                
                // Clear list
                // subjectsList.innerHTML = "";
                Array.from(subjectsList.children).forEach(child => {
    if (child.id !== "loadingState") child.remove();
});


                if (subjects.length === 0) {
                    emptyState.classList.remove('hidden');
                    subjectCount.textContent = '';
                } else {
                    emptyState.classList.add('hidden');
                    subjectCount.textContent = subjects.length + ' subject' + (subjects.length !== 1 ? 's' : '');

                    subjects.forEach(function(s, index) {
                        const div = document.createElement("div");
                        div.className = "subject-card rounded-xl p-4 flex items-center justify-between gap-4";
                        div.style.animationDelay = (index * 0.1) + 's';
                        
                        const icon = getSubjectIcon(s.name);
                        
                        div.innerHTML = '<div class="flex items-center gap-4 flex-1"><div class="subject-icon">' + icon + '</div><div><h4 class="font-semibold text-lg text-gray-100">' + s.name + '</h4><p class="text-sm text-gray-400">Added to your curriculum</p></div></div><button type="button" onclick="deleteSubject(' + s.id + ')" class="delete-btn px-4 py-2 rounded-lg font-medium text-sm">Delete</button>';
                        
                        subjectsList.appendChild(div);
                    });
                }

            } catch (err) {
                console.error(err);
                if (loadingState) loadingState.style.display = 'none';

                subjectsList.innerHTML = '<div class="text-center py-8 text-red-400"><p>⚠️ Could not load subjects</p><button onclick="loadSubjects()" class="mt-4 px-6 py-2 bg-red-500/20 border border-red-500/30 rounded-lg hover:bg-red-500/30 transition">Retry</button></div>';
            }
        }

        /* ================= ADD SUBJECT ================= */
        document.getElementById("subjectForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const name = document.getElementById("subjectName").value.trim();
            if (!name) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Adding...';
            submitBtn.disabled = true;

            try {
                const res = await fetch("https://lunea-aoc1.onrender.com/api/subjects/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer " + token
                    },
                    body: JSON.stringify({ subjects: [name] })
                });

                if (!res.ok) {
                    const err = await res.json().catch(function() { return {}; });
                    throw new Error(err.error || "Failed to add subject");
                }

                document.getElementById("subjectName").value = "";
                await loadSubjects();

            } catch (err) {
                console.error(err);
                alert(err.message);
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        /* ================= DELETE SUBJECT ================= */
        async function deleteSubject(id) {
            if (!confirm("Are you sure you want to delete this subject?")) return;

            try {
                const res = await fetch("https://lunea-aoc1.onrender.com/api/subjects/" + id + "/", {
                    method: "DELETE",
                    headers: { Authorization: "Bearer " + token }
                });

                if (!res.ok) {
                    const err = await res.json().catch(function() { return {}; });
                    throw new Error(err.error || "Failed to delete subject");
                }

                await loadSubjects();

            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }

        window.onload = loadSubjects;
    </script>

</body>
</html>
