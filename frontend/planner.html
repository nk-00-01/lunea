<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FocusFlow | AI Planner</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

* {
    font-family: 'Inter', sans-serif;
}

.navbar-glass {
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.card-glass {
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.gradient-border {
    position: relative;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
}

.gradient-border::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}

.btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
}

.table-row:hover {
    background: rgba(99, 102, 241, 0.05);
}
</style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#020617] via-[#020617] to-[#042f2e] text-white">

<!-- NAVBAR -->
<nav class="navbar-glass px-6 md:px-12 py-5 flex justify-between items-center sticky top-0 z-50">
    <h2 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
        🎓 StudentAI
    </h2>
    
    <div class="flex gap-4 md:gap-8 text-sm md:text-base">
        <a href="dashboard.html" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
        <a href="planner.html" class="text-white font-semibold border-b-2 border-indigo-500">Planner</a>
        <a href="exam.html" class="text-gray-300 hover:text-white transition-colors">Exams</a>
        <a href="profile.html" class="text-gray-300 hover:text-white transition-colors">Profile</a>
        <a href="#" onclick="logout()" class="text-gray-300 hover:text-red-400 transition-colors">Logout</a>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">

    <!-- PAGE TITLE -->
    <div class="mb-8">
        <h1 class="text-4xl md:text-5xl font-bold mb-3 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
            AI Study Planner
        </h1>
        <p class="text-gray-400 text-lg">Let AI optimize your study schedule based on your exams</p>
    </div>

    <!-- AI CONTROLS CARD -->
    <div class="card-glass rounded-2xl p-6 md:p-8 mb-8">
        <div class="flex flex-col md:flex-row gap-6 items-start md:items-center">
            <div class="flex-1">
                <label class="block text-sm font-semibold text-gray-300 mb-3">Daily Study Capacity</label>
                <select id="dailyHours" class="w-full md:w-64 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    <option value="2">2 hours per day</option>
                    <option value="3">3 hours per day</option>
                    <option value="4" selected>4 hours per day</option>
                    <option value="5">5+ hours per day</option>
                </select>
            </div>
            
            <button onclick="generatePlan()" class="btn-primary px-8 py-3 rounded-xl font-bold text-white shadow-lg w-full md:w-auto mt-2 md:mt-6">
                ✨ Generate AI Schedule
            </button>
        </div>
    </div>

    <!-- AI OUTPUT CARD -->
    <div class="card-glass rounded-2xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
            <span class="text-3xl">📅</span>
            <h2 class="text-2xl md:text-3xl font-bold">Your Personalized Study Plan</h2>
        </div>
        
        <div id="planArea" class="min-h-[300px]">
            <div class="flex flex-col items-center justify-center py-12 text-center">
                <div class="text-6xl mb-4">🤖</div>
                <p class="text-gray-400 text-lg">Click "Generate AI Schedule" to create your optimized study plan</p>
            </div>
        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="text-center py-6 text-sm text-gray-500 mt-12">
    © 2025 StudentAI Dashboard • Powered by AI
</footer>

<script>
const token = localStorage.getItem("token");
if (!token) {
    alert("Please login again");
    window.location.href = "login.html";
}

/* ---------- GENERATE NEW PLAN ---------- */
async function generatePlan() {
    const hours = document.getElementById("dailyHours").value;
    const planArea = document.getElementById("planArea");
    
    planArea.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
            <p class="text-gray-300 text-lg">🧠 AI is analyzing your exams and creating the perfect schedule...</p>
        </div>
    `;

    try {
        const res = await fetch("https://lunea-aoc1.onrender.com/api/ai/planner/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ daily_hours: hours })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            console.error("Backend error:", err);
            planArea.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">⚠️</div>
                    <p class="text-red-400 text-lg font-semibold">Backend error occurred. Please try again.</p>
                </div>
            `;
            return;
        }

        const data = await res.json().catch(() => ({}));

        if (!data.plan || data.plan.length === 0) {
            planArea.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">📚</div>
                    <p class="text-gray-400 text-lg">No exams found or AI could not generate a plan.<br>Add some exams first!</p>
                </div>
            `;
            return;
        }

        renderTable(data.plan);

    } catch (err) {
        console.error("JS error:", err);
        planArea.innerHTML = `
            <div class="text-center py-12">
                <div class="text-6xl mb-4">❌</div>
                <p class="text-red-400 text-lg font-semibold">AI generation failed. Please check your connection.</p>
            </div>
        `;
    }
}

/* ---------- RENDER PLAN TABLE ---------- */
function renderTable(schedule) {
    let html = `
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="border-b border-slate-700">
                        <th class="px-4 py-4 text-left text-sm font-bold text-indigo-400 uppercase tracking-wider">Date</th>
                        <th class="px-4 py-4 text-left text-sm font-bold text-indigo-400 uppercase tracking-wider">Subject</th>
                        <th class="px-4 py-4 text-left text-sm font-bold text-indigo-400 uppercase tracking-wider">Topic</th>
                        <th class="px-4 py-4 text-left text-sm font-bold text-indigo-400 uppercase tracking-wider">Hours</th>
                    </tr>
                </thead>
                <tbody>
    `;

    schedule.forEach((day, index) => {
        day.tasks.forEach((task, taskIndex) => {
            html += `
                <tr class="table-row border-b border-slate-800 transition-colors">
                    <td class="px-4 py-4 text-gray-300">${formatDate(day.date)}</td>
                    <td class="px-4 py-4">
                        <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-lg font-semibold text-sm">
                            ${task.subject}
                        </span>
                    </td>
                    <td class="px-4 py-4 text-gray-300">${task.topic}</td>
                    <td class="px-4 py-4">
                        <span class="inline-flex items-center gap-2 text-purple-400 font-bold">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                            </svg>
                            ${task.hours}h
                        </span>
                    </td>
                </tr>
            `;
        });
    });

    html += `
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 p-4 bg-indigo-500/10 border border-indigo-500/30 rounded-xl">
            <p class="text-sm text-indigo-300">
                💡 <strong>Pro Tip:</strong> This AI-generated schedule prioritizes exams based on difficulty and time remaining. Follow it consistently for best results!
            </p>
        </div>
    `;
    
    document.getElementById("planArea").innerHTML = html;
}

/* ---------- FORMAT DATE ---------- */
function formatDate(dateStr) {
    const date = new Date(dateStr);
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    return date.toLocaleDateString('en-US', options);
}

/* ---------- LOGOUT ---------- */
function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
}

/* ---------- LOAD SAVED PLAN ---------- */
window.onload = () => {
    fetchSavedPlan();
};

async function fetchSavedPlan() {
    try {
        const res = await fetch("https://lunea-aoc1.onrender.com/api/ai/planner/", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (!res.ok) return;

        const data = await res.json().catch(() => ({}));
        if (data.plan && data.plan.length > 0) {
            renderTable(data.plan);
        }
    } catch (err) {
        console.error("Failed to load saved plan", err);
    }
}
</script>

</body>
</html>
