<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .profile-container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-header h2 {
            margin: 0;
        }

        .profile-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .profile-form input,
        .profile-form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #34495e;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Edit Profile</h1>
</header>

<div class="profile-container">

    <div class="profile-header">
        <h2 id="studentName">Loading...</h2>
        <p>Student ID: <span id="studentId"></span></p>
    </div>

    <form class="profile-form" id="profileForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Phone Number</label>
        <input type="text" id="mobile">

        <label>Year</label>
        <select id="year">
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>

        <label>Branch</label>
        <select id="branch"></select>
        <label>Department</label>
        <input type="text" id="department" disabled>


        <!-- <label>Department</label>
        <input type="text" id="department" disabled> -->

        <button class="btn" type="submit">Update Profile</button>
    </form>

</div>


<footer>
    © 2025 Student Dashboard
</footer>

<script src="profile.js"></script>

</body>
</html>
