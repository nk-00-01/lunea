<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FocusFlow | StudentAI Dashboard</title>

<style>
/* ---------- NAVBAR ---------- */
.topbar {
    background: #13121b;
    color: #fff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 999;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 800;
    font-size: 20px;
}
.logo-mark {
    width: 36px;
    height: 36px;
    background: #ffffff10;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.topbar nav {
    display: flex;
    gap: 20px;
}
.topbar a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 6px;
}
.topbar a:hover { background:#1e1e2f; color:#fff; }
.topbar a.active {
    background: linear-gradient(90deg,#2b6ef6,#7c3aed);
    color: #fff;
}

/* ---------- GLOBAL ---------- */
:root{
    --primary:#2563eb;
    --bg:#f1f5f9;
    --surface:#ffffff;
    --border:#e2e8f0;
    --text:#1e293b;
    --muted:#64748b;
    --shadow:0 4px 6px -1px rgba(0,0,0,0.1);
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ---------- LAYOUT ---------- */
.container {
    max-width: 1400px;
    margin: 1.5rem auto;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 2rem;
    padding: 0 1.5rem;
}
.sidebar, .main {
    background: var(--surface);
    border-radius: 12px;
    padding: 2rem;
    box-shadow: var(--shadow);
    border:1px solid var(--border);
}

/* ---------- SIDEBAR ---------- */
.logo {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:1.5rem;
}
.logo-icon {
    width:40px;
    height:40px;
    background:var(--primary);
    color:#fff;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.form-group {
    margin-bottom:1.25rem;
}
label {
    font-weight:600;
    font-size:14px;
}
input, select {
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid var(--border);
}
.btn-primary {
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

/* ---------- DASHBOARD ---------- */
.dashboard-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:1.5rem;
}
.dash-card {
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:1.5rem;
    box-shadow:var(--shadow);
}
.dash-card h4 { margin-bottom:8px; }
.dash-value {
    font-size:32px;
    font-weight:800;
    color:var(--primary);
}
.dash-muted { color:var(--muted); font-size:14px; }

.actions {
    margin-top:2rem;
    display:flex;
    gap:1rem;
    flex-wrap:wrap;
}
.actions button {
    padding:10px 16px;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
}
.actions .planner { background:#2563eb; }
.actions .exams { background:#7c3aed; }
.actions .hack { background:#0ea5e9; }

/* ---------- RESPONSIVE ---------- */
@media(max-width:1024px){
    .container{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="topbar">
    <div class="brand">
        <div class="logo-mark">🎓</div>
        <div>StudentAI</div>
    </div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html" class="active">Planner</a>
        <a href="exam.html">Exams</a>
        <a href="hackathon.html">Hackathons</a>
        <a href="profile.html">Profile</a>
        <a href="settings.html">Settings</a>
        <a href="#">Logout</a>
    </nav>
</header>

<!-- MAIN LAYOUT -->
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <h2>FocusFlow AI</h2>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input placeholder="e.g. Alex Johnson">
        </div>

        <div class="form-group">
            <label>Academic Branch</label>
            <select>
                <option>Select your major...</option>
                <option>CSE</option>
                <option>IT</option>
                <option>ECE</option>
                <option>Mechanical</option>
            </select>
        </div>

        <div class="form-group">
            <label>Daily Capacity</label>
            <select>
                <option>2 hours</option>
                <option>3 hours</option>
                <option selected>4 hours</option>
                <option>5+ hours</option>
            </select>
        </div>

        <button class="btn-primary">Generate Schedule</button>
    </aside>

    <!-- DASHBOARD MAIN -->
    <main class="main">

        <h2 style="margin-bottom:1.5rem;">Dashboard Overview</h2>

        <div class="dashboard-grid">
            <div class="dash-card">
                <h4>📚 Study Hours</h4>
                <div class="dash-value">4</div>
                <div class="dash-muted">Today</div>
            </div>

            <div class="dash-card">
                <h4>📝 Pending Tasks</h4>
                <div class="dash-value">3</div>
                <div class="dash-muted">Assignments</div>
            </div>

            <div class="dash-card">
                <h4>📅 Exams</h4>
                <div class="dash-value">2</div>
                <div class="dash-muted">Upcoming</div>
            </div>

            <div class="dash-card">
                <h4>🚀 Hackathons</h4>
                <div class="dash-value">1</div>
                <div class="dash-muted">Nearby</div>
            </div>
        </div>

       

    </main>
</div>

</body>
</html>
